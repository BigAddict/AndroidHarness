[project]
name = "androidharness"
version = "0.1.0"
description = "AI harness for driving Android devices via uiautomator2 + Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uiautomator2>=3.5.0",
    "uiautodev>=0.14.0",
    "google-genai>=0.3.0",
    "lxml>=5.0.0",
    "pillow>=10.0.0",
    "typer>=0.12.0",
]

[project.scripts]
androidharness = "androidharness.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["androidharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
